org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
# Flutter plugins are resolved from the Pub cache on C: while this project is
# on F:. Kotlin's incremental cache cannot reliably persist paths across those
# volumes under AGP 9, so compile plugins without that cache.
kotlin.incremental=false
# Flutter's Gradle plugin currently needs the compatibility DSL when an
# existing project is migrated to AGP 9. These are generated by `flutter
# create` for this migration path and can be removed once Flutter adopts AGP
# 9's built-in Kotlin/new DSL implementation.
android.builtInKotlin=false
android.newDsl=false
