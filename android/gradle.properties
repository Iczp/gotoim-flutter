# Keep Android debug builds within the available Windows commit limit.  The
# previous 1.5GB Gradle heap plus parallel workers/Kotlin daemon could exhaust
# native memory and terminate the Gradle JVM on this machine.
org.gradle.jvmargs=-Xms256M -Xmx768M -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=GBK
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# Flutter plugins are resolved from the Pub cache on C: while this project is
# on F:. Kotlin's incremental cache cannot reliably persist paths across those
# volumes under AGP 9, so compile plugins without that cache.
kotlin.incremental=false
# Avoid a separate long-lived Kotlin compiler JVM (it was also configured with
# a 1.5GB heap), keeping compilation inside the capped Gradle process.
kotlin.compiler.execution.strategy=in-process
# Flutter's Gradle plugin currently needs the compatibility DSL when an
# existing project is migrated to AGP 9. These are generated by `flutter
# create` for this migration path and can be removed once Flutter adopts AGP
# 9's built-in Kotlin/new DSL implementation.
android.builtInKotlin=false
android.newDsl=false
