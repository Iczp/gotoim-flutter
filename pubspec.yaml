name: gotoim_flutter
description: Cross-platform Goto IM client foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  go_router: ^6.5.7
  flutter_dotenv: ^5.1.0
  dio: ^5.1.2
  flutter_secure_storage: ^8.0.0
  uuid: ^3.0.7
  # 13.0.0 remains compatible with this project's Dart 2.19 SDK.
  flutter_local_notifications: 13.0.0
  # 1.3.6 is the latest release resolving under this project's Dart 2.19 SDK.
  signalr_netcore: 1.3.6
  # 4.0.x remains compatible with the project's Dart 2.19.4 SDK.
  qr_flutter: ^4.0.0
  # 3.0.0 predates dart:ui_web and remains compatible with this Flutter SDK.
  mobile_scanner: 3.0.0
  # Used by the unified scanner to decode QR/barcodes from an album image.
  image_picker: ^1.0.4
  # Desktop and web use an explicit file-upload flow when no camera is present.
  # 5.3.1 avoids the Dart 3-only win32 dependency introduced in later 5.x releases.
  file_picker: 5.3.1
  # Pure Dart QR image decoder used as the web/desktop upload fallback.
  image: ^3.3.0
  # 0.2.0 is the newest release compatible with this Dart 2.19 project.
  zxing2: 0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - .env.staging
    - .env.production
