name: gotoim_flutter
description: Cross-platform Goto IM client foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  go_router: ^6.5.7
  flutter_dotenv: ^5.1.0
  dio: ^5.1.2
  flutter_secure_storage: ^8.0.0
  uuid: ^3.0.7
  # 13.0.0 remains compatible with this project's Dart 2.19 SDK.
  flutter_local_notifications: 13.0.0
  # 1.3.6 is the latest release resolving under this project's Dart 2.19 SDK.
  signalr_netcore: 1.3.6
  # 4.0.x remains compatible with the project's Dart 2.19.4 SDK.
  qr_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - .env.staging
    - .env.production
