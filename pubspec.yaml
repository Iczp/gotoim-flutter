name: gotoim_flutter
description: Cross-platform Goto IM client foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_dotenv: ^6.0.1
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0
  signalr_netcore: ^1.4.4
  qr_flutter: ^4.1.0
  # Android/iOS camera adapter. Web and desktop retain the shared API but do
  # not initialize a camera scanner until a dedicated adapter is introduced.
  mobile_scanner: ^7.4.0
  # Used by the unified scanner to decode QR/barcodes from an album image.
  image_picker: ^1.2.3
  # Interactive 1:1 avatar cropper on Android/iOS/Web. Desktop falls back to
  # the project-owned center-crop processor until a native desktop crop UI is added.
  image_cropper: ^12.2.1
  # Desktop and web use an explicit file-upload flow when no camera is present.
  file_picker: ^12.0.0
  # Pure Dart QR image decoder used as the web/desktop upload fallback.
  image: ^4.9.1
  zxing2: ^0.2.4
  # Unified client capability adapters. These remain behind a project service
  # so business/UI code never depends on their plugin APIs.
  connectivity_plus: ^7.3.1
  network_info_plus: ^8.2.1
  app_settings: ^9.0.0
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  device_info_plus: ^13.2.0
  # Media/file capability adapters. Video processing is mobile/macOS only;
  # other platforms keep the contract and return an explicit unsupported result.
  video_compress: ^3.1.4
  record: ^7.1.1
  path_provider: ^2.1.5
  # One SQLite API on Android/iOS/desktop/Web. Native platforms persist a
  # sqlite file; Web uses SQLite WASM with browser-backed storage.
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Unified Android/iOS/macOS/Windows WebView host for the JS Bridge harness.
  # 6.2 fixes Android Gradle Plugin 9 compatibility; use the current beta
  # until its stable release is available.
  flutter_inappwebview: ^6.2.0-beta.3
  app_links: 7.2.1
  wechat_assets_picker: ^10.1.3
  cached_network_image: ^3.4.1
  audioplayers: ^6.8.1
  flutter_markdown_plus: ^1.0.12
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - .env.staging
    - .env.production
    - assets/file_web/
    - assets/file_web/assets/
    - assets/devtools/remote/
    - assets/devtools/remote/assets/
    - assets/images/

