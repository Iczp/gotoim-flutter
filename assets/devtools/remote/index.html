<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GotoIM Remote DevTools</title><link rel="stylesheet" href="/app.css"></head>
<body><header><strong>GotoIM Remote DevTools / AI Diagnostic Console</strong><span id="status"></span><div><button onclick="capture(true)">Start capture</button><button onclick="capture(false)">Stop capture</button><button id="pause" onclick="pauseView()">Pause view</button><button onclick="clearServer()">Clear server</button><button onclick="addMarker()">Marker</button><button onclick="copyForAi()">Copy for AI</button><button onclick="downloadBundle()">Diagnostic bundle</button><input id="query" placeholder="Search current logs" oninput="render()"><select id="level" onchange="render()"><option value="">All levels</option><option>error</option><option>warning</option><option>info</option><option>debug</option></select></div></header><main id="logs"></main><pre id="detail">Select a log entry to view its sanitized diagnostic JSON.</pre><script src="/app.js"></script></body></html>
